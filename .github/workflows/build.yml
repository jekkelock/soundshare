name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: |
          cargo build --release --bin soundshare
          BIN_PATH="target/release/${{ matrix.os == 'windows-latest' && 'soundshare.exe' || 'soundshare' }}"
          SIZE=$(wc -c < "$BIN_PATH")
          echo "Binary size: $SIZE bytes"

      - name: Run loopback test
        run: |
          cargo build --release --bin loopback_test
          timeout 30s ./target/release/loopback_test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundshare-${{ matrix.os }}-latest
          path: target/release/soundshare${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 14
