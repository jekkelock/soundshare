[package]
name = "soundshare"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Ultra-lightweight cross-platform whole-system audio loopback streaming over LAN (Opus/UDP)"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
cpal = "=0.18.2"
opus = "0.4"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
    tiny_http = "0.12"
    sha1 = "0.10"
    base64 = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.release.package.opus]
opt-level = 2

[[bin]]
name = "soundshare"
path = "src/main.rs"

[[bin]]
name = "loopback_test"
path = "src/bin/loopback_test.rs"

[features]
default = []
